name: docs

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --strict turns a broken internal link or a page missing from nav into a build
      # failure instead of a silent warning.
      - run: mkdocs build --strict

  # Versioned docs (mike): main is published as the "dev" version on the gh-pages
  # branch, which GitHub Pages serves ("Deploy from a branch": gh-pages, / (root)).
  # Release versions (X.Y + "latest") are published by hand with
  # scripts/publish-docs.sh X.Y.Z, alongside each GitHub Release of xatc.
  deploy-dev:
    name: deploy dev (mike -> gh-pages)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never cancel a deploy halfway through its push.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: scripts/publish-docs.sh dev
