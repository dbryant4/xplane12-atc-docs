site_name: xatc
site_description: Automated FAA-style voice ATC for X-Plane 12
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Settings reference: settings.md
  - Features:
      - features/index.md
      - Radio panel: features/radio-panel.md
      - Controller positions & frequencies: features/controller-positions.md
      - Flight state across restarts: features/flight-state.md
      - Live-sim robustness: features/live-sim-robustness.md
      - ATIS & weather: features/atis-weather.md
      - Runway selection: features/runway-selection.md
      - IFR clearance (CRAFT): features/ifr-clearance.md
      - SID & departure procedures: features/sid-departure-procedures.md
      - Readback checking: features/readback-checking.md
      - Taxi routing & hold-shorts: features/taxi-routing.md
      - Tower takeoff clearance: features/tower-clearance.md
      - Voice (Transcribe, Polly, PTT): features/voice.md
      - VHF radio effect: features/radio-fx.md
      - Intent parsing & LLM modes: features/intent-parsing.md
      - Departure & Center: features/departure-center.md
      - Route tracking (next fix): features/route-tracking.md
      - Arrival: features/arrival.md
      - Conformance monitor: features/conformance-monitor.md
      - Fuzzy ramp resolver (taxi-in only): features/fuzzy-ramp-resolver.md
      - Any-airport data loading: features/any-airport-data.md
      - SimBrief import: features/simbrief-import.md
      - Post-flight debrief: features/debrief.md
      - Joystick/yoke PTT (Windows only): features/joystick-ptt.md
      - ATIS letter check: features/atis-letter-check.md
      - En-route pilot requests: features/enroute-requests.md
      - Emergencies and special squawks: features/emergencies.md
      - Pushback: features/pushback.md
      - VFR pattern work: features/vfr-pattern.md
      - VFR flight following: features/vfr-flight-following.md
      - VFR Class B/C/D airspace entry: features/vfr-airspace-entry.md
      - Traffic advisories (not yet live): features/traffic-advisories.md
  - Roadmap: roadmap.md
