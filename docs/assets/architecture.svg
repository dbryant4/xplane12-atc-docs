<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" />
    </marker>
  </defs>
  <style>
    .box { fill: #f5f7fa; stroke: #4a5568; stroke-width: 1.5; rx: 8; }
    .box-accent { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; rx: 8; }
    .title { font-size: 15px; font-weight: 700; fill: #1a202c; }
    .sub { font-size: 11.5px; fill: #4a5568; }
    .edge { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .edge-label { font-size: 11px; fill: #333; }
  </style>

  <!-- Pilot -->
  <rect x="20" y="270" width="120" height="70" class="box-accent" />
  <text x="80" y="300" text-anchor="middle" class="title">Pilot</text>
  <text x="80" y="318" text-anchor="middle" class="sub">speaks / PTT</text>

  <!-- Radio Panel UI -->
  <rect x="200" y="40" width="220" height="110" class="box" />
  <text x="310" y="65" text-anchor="middle" class="title">Radio Panel UI</text>
  <text x="310" y="85" text-anchor="middle" class="sub">FastAPI + WebSocket, browser</text>
  <text x="310" y="102" text-anchor="middle" class="sub">COM1/COM2, PTT, directory,</text>
  <text x="310" y="118" text-anchor="middle" class="sub">transcript, options screen</text>

  <!-- Voice session -->
  <rect x="200" y="230" width="220" height="150" class="box" />
  <text x="310" y="255" text-anchor="middle" class="title">Voice Session</text>
  <text x="310" y="275" text-anchor="middle" class="sub">Transcribe (speech to text)</text>
  <text x="310" y="292" text-anchor="middle" class="sub">Polly (text to speech)</text>
  <text x="310" y="309" text-anchor="middle" class="sub">VHF radio effect (RadioFx)</text>
  <text x="310" y="326" text-anchor="middle" class="sub">half-duplex, priority queue,</text>
  <text x="310" y="343" text-anchor="middle" class="sub">ATIS loop</text>

  <!-- Sim Bridge -->
  <rect x="200" y="480" width="220" height="100" class="box" />
  <text x="310" y="505" text-anchor="middle" class="title">Sim Bridge</text>
  <text x="310" y="525" text-anchor="middle" class="sub">X-Plane 12 Web API (:8086)</text>
  <text x="310" y="542" text-anchor="middle" class="sub">position, COM freqs, transponder</text>
  <text x="310" y="559" text-anchor="middle" class="sub">record / replay fixtures</text>

  <!-- X-Plane -->
  <rect x="20" y="490" width="120" height="80" class="box-accent" />
  <text x="80" y="520" text-anchor="middle" class="title">X-Plane 12</text>
  <text x="80" y="538" text-anchor="middle" class="sub">the sim</text>
  <text x="80" y="554" text-anchor="middle" class="sub">(or --replay)</text>

  <!-- ATC Engine (center, tall) -->
  <rect x="480" y="150" width="240" height="330" class="box-accent" />
  <text x="600" y="180" text-anchor="middle" class="title">ATC Engine</text>
  <text x="600" y="200" text-anchor="middle" class="sub">deterministic Python -- no LLM</text>
  <text x="600" y="200" text-anchor="middle" class="sub"> </text>
  <text x="600" y="225" text-anchor="middle" class="sub">phase state machine</text>
  <text x="600" y="245" text-anchor="middle" class="sub">controller positions + handoffs</text>
  <text x="600" y="265" text-anchor="middle" class="sub">runway selector</text>
  <text x="600" y="285" text-anchor="middle" class="sub">CRAFT clearance generator</text>
  <text x="600" y="305" text-anchor="middle" class="sub">taxi router (A*) + hold-shorts</text>
  <text x="600" y="325" text-anchor="middle" class="sub">tower takeoff clearance</text>
  <text x="600" y="345" text-anchor="middle" class="sub">rules-based intent parser</text>
  <text x="600" y="365" text-anchor="middle" class="sub">phraseology renderer</text>
  <text x="600" y="390" text-anchor="middle" class="sub" font-style="italic">departure/center, conformance,</text>
  <text x="600" y="407" text-anchor="middle" class="sub" font-style="italic">fuzzy ramp resolver: in progress</text>
  <text x="600" y="440" text-anchor="middle" class="sub" font-style="italic">optional: Nova Lite as an LLM</text>
  <text x="600" y="457" text-anchor="middle" class="sub" font-style="italic">fallback for low-confidence intents</text>

  <!-- World Data -->
  <rect x="800" y="60" width="160" height="90" class="box" />
  <text x="880" y="85" text-anchor="middle" class="title">World Data</text>
  <text x="880" y="103" text-anchor="middle" class="sub">apt.dat: runways,</text>
  <text x="880" y="119" text-anchor="middle" class="sub">taxi graph, frequencies,</text>
  <text x="880" y="135" text-anchor="middle" class="sub">flow rules</text>

  <!-- Weather -->
  <rect x="800" y="440" width="160" height="90" class="box" />
  <text x="880" y="465" text-anchor="middle" class="title">Weather + ATIS</text>
  <text x="880" y="483" text-anchor="middle" class="sub">sim datarefs, METAR,</text>
  <text x="880" y="499" text-anchor="middle" class="sub">flight category,</text>
  <text x="880" y="515" text-anchor="middle" class="sub">ATIS letter</text>

  <!-- Shared contract note -->
  <text x="600" y="605" text-anchor="middle" class="sub" font-style="italic">Panel, Voice and the Engine meet at one shared typed contract: contracts.py</text>

  <!-- Edges -->
  <path class="edge" d="M140,290 C170,270 170,120 200,100" />
  <path class="edge" d="M200,105 C170,150 170,290 140,310" />
  <text x="150" y="200" class="edge-label">speak / listen</text>

  <path class="edge" d="M140,520 C170,520 170,520 200,520" />
  <path class="edge" d="M200,530 C170,540 170,540 140,540" />
  <text x="148" y="580" class="edge-label">datarefs</text>

  <path class="edge" d="M310,150 C310,190 310,190 310,230" />
  <text x="320" y="195" class="edge-label">PTT</text>

  <path class="edge" d="M310,480 C310,440 310,440 310,150" />
  <text x="245" y="440" class="edge-label">aircraft state</text>

  <path class="edge" d="M420,90 C450,110 450,130 480,180" />
  <text x="415" y="105" class="edge-label">state, directory</text>

  <path class="edge" d="M420,300 C450,300 450,320 480,340" />
  <text x="415" y="295" class="edge-label">reply text</text>

  <path class="edge" d="M420,520 C450,460 450,320 480,300" />
  <text x="428" y="470" class="edge-label">tick</text>

  <path class="edge" d="M800,105 C750,140 750,160 720,220" />
  <path class="edge" d="M800,485 C750,450 750,340 720,330" />
</svg>
